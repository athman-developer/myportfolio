name: Build Qiblah APK

on:
  push:
    branches:
      - qiblah-apk-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: qiblah_build
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp qiblah_build/app/build/outputs/apk/debug/app-debug.apk QiblahDirection.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QiblahDirection-APK
          path: QiblahDirection.apk
          retention-days: 7
